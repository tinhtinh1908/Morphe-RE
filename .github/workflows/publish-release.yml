name: Publish requested release
on:
  push:
    branches: [main]
    paths:
      - '.github/release.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare validated release
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          request = json.loads(Path(".github/release.json").read_text())
          version, target = request["version"], request["target"]
          assert re.fullmatch(r"\d+\.\d+\.\d+(?:-dev\.\d+)?", version)
          prerelease = request.get("prerelease", False)
          assert isinstance(prerelease, bool) and prerelease == ("-dev." in version)
          assert re.fullmatch(r"[0-9a-f]{40}", target)
          replace_existing = request.get("replace_existing", False)
          assert isinstance(replace_existing, bool)
          expected_target = request.get("expected_target", "")
          if replace_existing:
              assert re.fullmatch(r"[0-9a-f]{40}", expected_target)
              assert expected_target != target
          def read(path):
              return subprocess.check_output(["git", "show", target + ":" + path])
          assert read("VERSION").decode().strip() == version
          filename = "DTinh-MicroG-FCM-" + version + ".mpp"
          Path("dist").mkdir(exist_ok=True)
          subprocess.run(["git", "checkout", "--detach", target], check=True)
          subprocess.run(["bash", "build.sh"], check=True)
          assert Path("dist", filename).is_file()
          paths = subprocess.check_output(["git", "ls-tree", "-r", "--name-only", target]).decode().splitlines()
          paths = [p for p in paths if not p.startswith("releases/")]
          source = "dist/DTinh-MicroG-FCM-" + version + "-source.zip"
          subprocess.run(["git", "archive", "--format=zip", "--prefix=DTinh-MicroG-FCM-" + version + "/", "-o", source, target, "--", *paths], check=True)
          for p in ["LICENSE", "LICENSE-patches", "LICENSE-zeldris", "THIRD_PARTY_NOTICES.md", "LICENSING.md"]:
              Path("dist", p).write_bytes(read(p))
          checksums = []
          for p in sorted(Path("dist").iterdir()):
              if p.is_file():
                  checksums.append(hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name)
          Path("dist/SHA256SUMS").write_text("\n".join(checksums) + "\n")
          changelog = read("CHANGELOG.md").decode()
          notes = changelog.split("## " + version + "\n", 1)[1].split("\n## ", 1)[0].strip()
          notes += "\n\nNguồn tương ứng: tải tệp source.zip trong Assets hoặc xem commit " + target + ". Nguồn/giấy phép: THIRD_PARTY_NOTICES.md và LICENSING.md trong Assets, source và MPP. Gmail hỗ trợ phiên bản 2026.09.21.992487546.Release; dùng APK đã hợp nhất đầy đủ các split.\n\nChọn bản vá riêng cho ứng dụng trong Morphe Manager. Xem thư mục validation tại commit phát hành để biết phạm vi kiểm chứng. Nhận push/đăng nhập thực tế cần kiểm tra trên thiết bị.\n"
          Path("release-notes.md").write_text(notes)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("RELEASE_TAG=v" + version + "\n")
              env.write("RELEASE_PRERELEASE=" + str(prerelease).lower() + "\n")
              env.write("RELEASE_TARGET=" + target + "\n")
              env.write("RELEASE_REPLACE=" + str(replace_existing).lower() + "\n")
              env.write("RELEASE_EXPECTED_TARGET=" + expected_target + "\n")
              env.write("RELEASE_ASSET=dist/" + filename + "\n")
          PY
      - name: Publish release with MPP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$RELEASE_REPLACE" = "true" ]; then
              current=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
              test "$current" = "$RELEASE_EXPECTED_TARGET"
              gh release upload "$RELEASE_TAG" dist/* --clobber
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" -f sha="$RELEASE_TARGET" -F force=true >/dev/null
              gh release edit "$RELEASE_TAG" --notes-file release-notes.md
            else
              echo "Release already exists; leaving it unchanged."
            fi
          else
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_TARGET" --title "DTinh MicroG FCM $RELEASE_TAG (Experimental)" --notes-file release-notes.md --prerelease --latest=false
            else
              gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_TARGET" --title "DTinh MicroG FCM $RELEASE_TAG" --notes-file release-notes.md --latest
            fi
          fi
      - name: Update Manager source metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          repo = os.environ["GH_REPO"]
          tag = os.environ["RELEASE_TAG"]
          release = json.loads(subprocess.check_output(["gh", "api", "repos/" + repo + "/releases/tags/" + tag]))
          assert not release["draft"]
          version = tag.removeprefix("v")
          asset = next(a for a in release["assets"] if a["name"] == "DTinh-MicroG-FCM-" + version + ".mpp" and a["state"] == "uploaded")
          metadata = {
              "version": version,
              "download_url": asset["browser_download_url"],
              "created_at": (release["updated_at"] if os.environ["RELEASE_REPLACE"] == "true" else release["published_at"]).removesuffix("Z"),
              "description": release["body"] or "",
              "page_url": release["html_url"],
          }
          content = json.dumps(metadata, ensure_ascii=False, indent=2) + "\n"
          def version_key(value):
              import re
              match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:-dev\.(\d+))?", value)
              if not match:
                  raise ValueError("Unsupported source version: " + value)
              major, minor, patch, dev = match.groups()
              return (int(major), int(minor), int(patch), dev is None, int(dev or 0))
          # Stable releases also advance dev, unless it already advertises a newer build.
          branches = ["dev"] if release["prerelease"] else ["main", "dev"]
          endpoint = "repos/" + repo + "/contents/patches-bundle.json"
          for branch in branches:
              existing = subprocess.run(["gh", "api", endpoint + "?ref=" + branch], capture_output=True, text=True)
              payload = {"message": "Update Morphe Manager source metadata for " + tag, "branch": branch, "content": base64.b64encode(content.encode()).decode()}
              if existing.returncode == 0:
                  current = json.loads(existing.stdout)
                  current_content = base64.b64decode(current["content"]).decode()
                  if version_key(json.loads(current_content)["version"]) > version_key(version):
                      print("Keeping newer source metadata on " + branch)
                      continue
                  if current_content == content:
                      print("Manager metadata already up to date on " + branch)
                      continue
                  payload["sha"] = current["sha"]
              else:
                  assert "404" in existing.stderr, existing.stderr
              Path("metadata-request.json").write_text(json.dumps(payload))
              subprocess.run(["gh", "api", "--method", "PUT", endpoint, "--input", "metadata-request.json"], check=True, stdout=subprocess.DEVNULL)
              print("Manager source metadata published on " + branch)
          PY
